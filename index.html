<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meeting Loop has moved to wiredstack.ai</title>

<!-- La redirection elle-meme. La balise refresh agit sans JavaScript ;
     la balise canonique reporte le referencement sur la nouvelle adresse. -->
<meta http-equiv="refresh" content="0; url=https://wiredstack.ai/tools/meeting-loop.html">
<link rel="canonical" href="https://wiredstack.ai/tools/meeting-loop.html">
<meta name="robots" content="noindex, follow">

<style>
  :root {
    --paper: #FAF8F5; --ink: #1C1C1C; --sub: #5E5A54; --acc: #C2255C;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 32px;
  }
  main { max-width: 420px }
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--acc); margin: 0 0 18px;
  }
  h1 { font-size: 27px; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 14px }
  p { font-size: 15.5px; line-height: 1.6; color: var(--sub); margin: 0 0 26px }
  a.go {
    font-family: var(--mono); font-size: 13px; letter-spacing: .04em;
    color: var(--acc); text-decoration: none; border-bottom: 1px solid var(--acc);
    padding-bottom: 2px;
  }
  a.go:hover { color: var(--ink); border-color: var(--ink) }
</style>
</head>
<body>
<main>
  <p class="kicker">~/moved</p>
  <h1>The Meeting Loop now lives on wiredstack.ai</h1>
  <p>You are being redirected. If nothing happens, follow the link below.</p>
  <a class="go" href="https://wiredstack.ai/tools/meeting-loop.html">Open the Meeting Loop &rarr;</a>
</main>
<script>location.replace('https://wiredstack.ai/tools/meeting-loop.html')</script>
</body>
</html>
